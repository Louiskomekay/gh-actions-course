name: 06 - Contexts

run-name: 06 - Contexts | DEBUG - ${{inputs.debug}}

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

env:
  MY_WORKFLOW_VAR: "Workflow"
  MY_OVERWRITTEN_VAR: "Workflow"

jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
      MY_JOB_VAR: "Job"
      MY_OVERWRITTEN_VAR: "Job"
    steps:
    - name: Display information about the workflow run
      run: |
        echo "Workflow name: ${{ github.workflow }}"
        echo "Event name: ${{ github.event_name }}"
        echo "Actor: ${{ github.actor }}"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "Run number: ${{ github.run_number }}"
        echo "Actor: ${{ github.actor }}"
    - name: Retrieve Variables
      env:
        MY_VAR: "Placeholder Variable Value"
      run: |
        echo "Variable value: ${{env.MY_VAR}}"
    - name: Print Env Variables
      env:
        MY_OVERWRITTEN_VAR: "Step"
      run: |
        echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
        echo "Job env: ${{ env.MY_JOB_VAR }}"
        echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
    - name: Print Env Variables II
      run: |
        echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"

  echo-data2:
    runs-on: ubuntu-latest
    steps:
    - name: Print another ENV
      run: |
        echo "Workflow env: $MY_WORKFLOW_VAR"
